name: Documentation review

# The caller owns the trigger. This wrapper reviews opened and synchronized
# pull requests in the consumer repository.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: your-organization/generic-agentic-workflows/.github/workflows/opencode-review.yml@<pinned-sha>
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration_source: local
      configuration_profile: documentation-review
      focus: documentation
      max_comments: 10
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Optional: forward a read token for a private central configuration repo.
      central_config_token: ${{ secrets.CENTRAL_CONFIG_TOKEN }}
# When configuration_source is `central` (a private remote config repo), set
# configuration_source: central, configuration_ref: <40-char SHA>, and forward
# central_config_token with a read-capable token for that repository.
