name: Issue implementation

# The caller owns the trigger. This wrapper dispatches issue implementation on
# a schedule or manually. Issue implementation is write-capable, so enable it
# last and prefer validate_only/dry_run during rollout.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to implement
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: consumer-issue-implementation
  cancel-in-progress: false

jobs:
  implement:
    uses: your-organization/generic-agentic-workflows/.github/workflows/opencode-issue-implementation.yml@<pinned-sha>
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      configuration_source: local
      configuration_profile: default-implementation
      request_label: ai-review-requested
      issue_number: ${{ inputs.issue_number != '' && inputs.issue_number || 0 }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      central_config_token: ${{ secrets.CENTRAL_CONFIG_TOKEN }}
