name: Issue feedback

# The caller owns the trigger. This wrapper reviews a single opened issue in
# the consumer repository. To review all open issues, omit issue_number and set
# max_issues to bound the batch.
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    uses: your-organization/generic-agentic-workflows/.github/workflows/opencode-issue-feedback.yml@<pinned-sha>
    permissions:
      contents: read
      issues: write
    with:
      configuration_source: local
      configuration_profile: issue-feedback
      focus: general
      max_issues: 20
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      central_config_token: ${{ secrets.CENTRAL_CONFIG_TOKEN }}
