name: Release project review (self, local configuration)

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  release-review:
    # The pin below must point to a reviewed release commit that contains the
    # reusable workflow. The placeholder SHA shown predates the release
    # project-review work and is a format placeholder only; replace it before
    # enabling this workflow.
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-release-project-review.yml@61ed1bbd34a878f3ae270b1e4ff027cf786b730b
    permissions:
      contents: read
      issues: write
    with:
      target_repository: ${{ github.repository }}
      release_id: ${{ github.event.release.id }}
      configuration_source: local
      configuration_profile: local-release-project-review
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}