name: Release project review (self, local configuration)

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  release-review:
    # The pin below must point to a reviewed release commit containing the
    # reusable workflow.
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-release-project-review.yml@72177b0f334301559f866f19baca2e0204104121
    permissions:
      contents: read
      issues: write
    with:
      target_repository: ${{ github.repository }}
      release_id: ${{ github.event.release.id }}
      configuration_source: local
      configuration_profile: local-release-project-review
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}