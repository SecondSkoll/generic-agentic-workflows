name: Documentation review (local configuration)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-documentation-review.yml@72177b0f334301559f866f19baca2e0204104121
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration_source: local
      configuration_profile: local-documentation-review
      focus: documentation
      max_comments: 5
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}