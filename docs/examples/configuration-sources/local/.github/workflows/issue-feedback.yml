name: Issue feedback (local configuration)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-issue-feedback.yml@72177b0f334301559f866f19baca2e0204104121
    permissions:
      contents: read
      issues: write
    with:
      configuration_source: local
      configuration_profile: local-issue-feedback
      focus: general
      max_issues: 20
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}