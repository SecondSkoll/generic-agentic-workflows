name: Issue feedback (local configuration)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-issue-feedback.yml@67039ac7f3157d0986952a5cb2c087827f5a9e1f
    permissions:
      contents: read
      issues: write
    with:
      configuration_source: local
      configuration_profile: local-issue-feedback
      focus: general
      max_issues: 20
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}