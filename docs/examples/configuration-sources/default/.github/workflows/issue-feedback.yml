name: Issue feedback (supplied default configuration)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-issue-feedback.yml@6418b0c0ccc4100dc1d86b611b18a166b21aefe5
    permissions:
      contents: read
      issues: write
    with:
      configuration_source: default
      configuration_ref: 6418b0c0ccc4100dc1d86b611b18a166b21aefe5
      configuration_profile: issue-feedback
      focus: general
      max_issues: 20
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}