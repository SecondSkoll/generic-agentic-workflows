name: Issue feedback (supplied default configuration)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-issue-feedback.yml@186fc769bdcc2a711b8321df7c2949a09c48578b
    permissions:
      contents: read
      issues: write
    with:
      configuration_source: default
      configuration_ref: 186fc769bdcc2a711b8321df7c2949a09c48578b
      configuration_profile: issue-feedback
      focus: general
      max_issues: 20
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}