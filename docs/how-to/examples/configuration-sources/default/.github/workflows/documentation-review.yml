name: Documentation review (supplied default configuration)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-documentation-review.yml@186fc769bdcc2a711b8321df7c2949a09c48578b
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration_source: default
      configuration_ref: 186fc769bdcc2a711b8321df7c2949a09c48578b
      configuration_profile: documentation-review
      focus: documentation
      max_comments: 10
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}