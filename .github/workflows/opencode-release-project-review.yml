name: OpenCode release project review

# Manual/reusable only. This workflow never runs automatically on a release
# event; it examines a published GitHub release identified by a release ID or
# tag and creates at most one release-readiness issue in the reviewed
# repository. The supplied `release-project-review` profile is the default for
# direct runs (resolved from the trusted checkout as the `local` source) and
# for reusable calls that select `configuration_source: default`.
on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Canonical owner/repo of the release to review (strict owner/repo grammar)
        type: string
        required: false
        # Input defaults are evaluated while GitHub parses the workflow, when
        # contexts are unavailable. An empty value is resolved to the caller
        # repository by the runtime expression below.
        default: ''
      release_id:
        description: Positive GitHub release ID. Exactly one of release_id/release_tag is required.
        type: number
        required: false
        default: 0
      release_tag:
        description: Conservative release tag selector. Exactly one of release_id/release_tag is required.
        type: string
        required: false
        default: ''
      configuration_source:
        description: default (supplied profile), local (caller repository), or an approved central alias
        type: string
        required: false
        # Direct runs already have this repository checked out, so resolve the
        # supplied profile locally without requiring a redundant remote ref.
        default: local
      configuration_ref:
        description: Full 40-character commit SHA for a remote bundle
        type: string
        required: false
        default: ''
      configuration_profile:
        description: Bundle profile name
        type: string
        required: false
        default: release-project-review
      focus:
        description: Allowlisted release-management focus (not arbitrary prompt text)
        type: string
        required: false
        default: ''
      dry_run:
        description: Resolve, validate, and generate output without publishing
        type: boolean
        required: false
        default: false
      validate_only:
        description: Resolve and validate configuration only; no release fetch, checkout, model, or publication
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      target_repository:
        description: Canonical owner/repo of the release to review (strict owner/repo grammar)
        type: string
        # GitHub does not expose the github context while parsing a reusable
        # workflow input default. Callers must explicitly pass their target.
        required: true
      release_id:
        description: Positive GitHub release ID. Exactly one of release_id/release_tag is required.
        type: number
        required: false
        default: 0
      release_tag:
        description: Conservative release tag selector. Exactly one of release_id/release_tag is required.
        type: string
        required: false
        default: ''
      configuration_source:
        description: default (supplied profile), local (caller repository), or an approved central alias
        type: string
        required: false
        default: default
      configuration_ref:
        description: Full 40-character commit SHA for a remote bundle
        type: string
        required: false
        default: ''
      configuration_profile:
        description: Bundle profile name
        type: string
        required: false
        default: release-project-review
      focus:
        description: Allowlisted release-management focus (not arbitrary prompt text)
        type: string
        required: false
        default: ''
      dry_run:
        description: Resolve, validate, and generate output without publishing
        type: boolean
        required: false
        default: false
      validate_only:
        description: Resolve and validate configuration only; no release fetch, checkout, model, or publication
        type: boolean
        required: false
        default: false
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter provider API key
        required: true
      release_target_token:
        description: 'Target-scoped GitHub token (contents: read, issues: write) for cross-repository release review. Falls back to github.token for same-repository runs.'
        required: false
      central_config_token:
        description: 'Optional read token for a private central configuration repository; falls back to github.token.'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  release-review:
    runs-on: ubuntu-latest
    env:
      FEEDBACK_KIND: release-project-review
    steps:
      # Keep caller-local configuration and policy at the workspace root.
      - name: Check out caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # For reusable calls, fetch helper code from the exact called workflow
      # revision. Direct/local runs already have those files and skip this.
      - name: Check out pinned workflow helpers
        if: job.workflow_repository != github.repository || job.workflow_sha != github.sha
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agentic-workflow
          persist-credentials: false

      - name: Select trusted workflow helpers
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ "$WORKFLOW_REPOSITORY" == "$GITHUB_REPOSITORY" && "$WORKFLOW_SHA" == "$GITHUB_SHA" ]]; then
            echo "AGENTIC_WORKFLOW_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "AGENTIC_WORKFLOW_ROOT=$GITHUB_WORKSPACE/.agentic-workflow" >> "$GITHUB_ENV"
          fi

      - name: Resolve invocation
        id: resolve
        env:
          AGENTIC_WORKFLOW: release-project-review
          # Consume inputs directly. github.event_name retains the caller's
          # original event during a reusable call and cannot distinguish it
          # from a direct dispatch.
          AGENTIC_CONFIGURATION_SOURCE: ${{ inputs.configuration_source || 'local' }}
          AGENTIC_CONFIGURATION_REF: ${{ inputs.configuration_ref || '' }}
          AGENTIC_CONFIGURATION_PROFILE: ${{ inputs.configuration_profile || 'release-project-review' }}
          AGENTIC_FOCUS: ${{ inputs.focus || '' }}
          AGENTIC_DRY_RUN: ${{ inputs.dry_run || false }}
          AGENTIC_VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          AGENTIC_TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          AGENTIC_RELEASE_ID: ${{ inputs.release_id || '' }}
          AGENTIC_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          python3 "$AGENTIC_WORKFLOW_ROOT/scripts/resolve_invocation.py" \
            --workflow release-project-review \
            --configuration-source "$AGENTIC_CONFIGURATION_SOURCE" \
            --configuration-ref "$AGENTIC_CONFIGURATION_REF" \
            --configuration-profile "$AGENTIC_CONFIGURATION_PROFILE" \
            --focus "$AGENTIC_FOCUS" \
            --dry-run "$AGENTIC_DRY_RUN" \
            --validate-only "$AGENTIC_VALIDATE_ONLY" \
            --target-repository "$AGENTIC_TARGET_REPOSITORY" \
            --release-id "$AGENTIC_RELEASE_ID" \
            --release-tag "$AGENTIC_RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --result "$RUNNER_TEMP/resolved-invocation.json"

      - name: Stop after validation-only
        if: steps.resolve.outputs.validate_only == 'true'
        env:
          AGENTIC_WORKFLOW_VERSION: ${{ job.workflow_sha }}
        run: |
          echo "validate_only selected; no release fetch, checkout, model invocation, or publication performed."
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location("agentic_provenance", Path(os.environ["AGENTIC_WORKFLOW_ROOT"]) / "scripts/agentic_provenance.py")
          prov = importlib.util.module_from_spec(spec); sys.modules[spec.name] = prov; spec.loader.exec_module(prov)
          record = prov.build_provenance(
              workflow_version=os.environ.get("AGENTIC_WORKFLOW_VERSION", "dev"),
              workflow_name="release-project-review",
              caller_repository=os.environ.get("GITHUB_REPOSITORY", ""),
              target_kind="release",
              target_number=None,
              target_head_sha=None,
              bundle=None,
              prompt_template_sha256=None,
              output_contract=None,
              model_profile=None,
              effective_policy_sha256=None,
              mode="validate-only",
              result="validated",
          )
          Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-provenance.json").write_text(record.to_json() + "\n")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          existing = summary.read_text() if summary.exists() else ""
          if existing and not existing.endswith("\n"):
              existing += "\n"
          summary.write_text(existing + prov.job_summary(record), encoding="utf-8")
          PY
          echo "::notice::Resolved configuration written to job summary and artifact."

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.resolve.outputs.validate_only != 'true'
        with:
          python-version: '3.12'

      - name: Resolve agentic configuration
        if: steps.resolve.outputs.validate_only != 'true'
        id: config
        env:
          AGENTIC_WORKFLOW: release-project-review
          AGENTIC_CONFIGURATION_SOURCE: ${{ steps.resolve.outputs.configuration_source }}
          AGENTIC_CONFIGURATION_REF: ${{ steps.resolve.outputs.configuration_ref }}
          AGENTIC_CONFIGURATION_PROFILE: ${{ steps.resolve.outputs.configuration_profile }}
          GITHUB_TOKEN: ${{ secrets.central_config_token || github.token }}
          AGENTIC_WORKFLOW_VERSION: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if ! python3 "$AGENTIC_WORKFLOW_ROOT/scripts/agentic_configuration.py" \
            --workflow release-project-review \
            --configuration-source "$AGENTIC_CONFIGURATION_SOURCE" \
            --configuration-ref "$AGENTIC_CONFIGURATION_REF" \
            --configuration-profile "$AGENTIC_CONFIGURATION_PROFILE" \
            --result "$RUNNER_TEMP/resolved-agentic-configuration.json"; then
            python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location("agentic_provenance", Path(os.environ["AGENTIC_WORKFLOW_ROOT"]) / "scripts/agentic_provenance.py")
          prov = importlib.util.module_from_spec(spec); sys.modules[spec.name] = prov; spec.loader.exec_module(prov)
          record = prov.failure_record(
              workflow_version=os.environ.get("AGENTIC_WORKFLOW_VERSION", "dev"),
              workflow_name="release-project-review",
              caller_repository=os.environ.get("GITHUB_REPOSITORY", ""),
              mode="publish",
              error=RuntimeError("configuration resolution failed"),
          )
          Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-provenance.json").write_text(record.to_json() + "\n")
          PY
            exit 1
          fi

      - name: Resolve effective policy
        if: steps.resolve.outputs.validate_only != 'true'
        id: policy
        env:
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          AGENTIC_WORKFLOW_VERSION: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          model_profile=$(jq -r '.model_profile' "$RUNNER_TEMP/resolved-agentic-configuration.json")
          mode="publish"
          if [[ "$DRY_RUN" == "true" ]]; then mode="dry-run"; fi
          agent_caps=$(python3 - <<'PY'
          import json, sys, os, importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("agentic_policy", Path(os.environ["AGENTIC_WORKFLOW_ROOT"]) / "scripts/agentic_policy.py")
          pol = importlib.util.module_from_spec(spec); sys.modules[spec.name] = pol; spec.loader.exec_module(pol)
          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-configuration.json").read_text())
          agent_text = (Path(data["bundle_root"]) / data["agent_file"]).read_text(encoding="utf-8")
          print(json.dumps(pol.parse_agent_capabilities(agent_text)))
          PY
          )
          overlay_arg=""
          if [[ -f .github/agentic-policy-overlay.json ]]; then
            overlay_arg="--overlay .github/agentic-policy-overlay.json"
          fi
          python3 "$AGENTIC_WORKFLOW_ROOT/scripts/agentic_policy.py" \
            --workflow release-project-review \
            --model-profile "$model_profile" \
            --resolved-config "$RUNNER_TEMP/resolved-agentic-configuration.json" \
            --agent-capabilities-json "$agent_caps" \
            --mode "$mode" \
            $overlay_arg \
            --result "$RUNNER_TEMP/effective-policy.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
          || {
            python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location("agentic_provenance", Path(os.environ["AGENTIC_WORKFLOW_ROOT"]) / "scripts/agentic_provenance.py")
          prov = importlib.util.module_from_spec(spec); sys.modules[spec.name] = prov; spec.loader.exec_module(prov)
          bundle = json.loads(Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-configuration.json").read_text())
          record = prov.failure_record(
              workflow_version=os.environ.get("AGENTIC_WORKFLOW_VERSION", "dev"),
              workflow_name="release-project-review",
              caller_repository=os.environ.get("GITHUB_REPOSITORY", ""),
              mode="publish",
              error=RuntimeError("policy resolution failed"),
              bundle=bundle,
          )
          Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-provenance.json").write_text(record.to_json() + "\n")
          PY
            exit 1
          }

      - name: Set up Node.js 24
        if: steps.resolve.outputs.validate_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install OpenCode
        if: steps.resolve.outputs.validate_only != 'true'
        run: npm install -g opencode-ai@1.18.16

      - name: Resolve release and prove target access
        if: steps.resolve.outputs.validate_only != 'true'
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Same-repository runs use the job token. External runs MUST use the
          # explicitly forwarded target-scoped token; the boolean flag below
          # is the authoritative signal that a target token was forwarded, so
          # the runner can fail closed for an external run that omits it. The
          # secret value itself is never logged.
          RELEASE_TARGET_TOKEN_FORWARDED: ${{ secrets.release_target_token != '' }}
          RELEASE_TARGET_TOKEN: ${{ secrets.release_target_token || github.token }}
          TARGET_REPOSITORY: ${{ steps.resolve.outputs.target_repository }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          CALLER_REPOSITORY: ${{ github.repository }}
          AGENTIC_WORKFLOW_VERSION: ${{ job.workflow_sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 "$AGENTIC_WORKFLOW_ROOT/scripts/run_agentic_release_project_review.py" resolve-only \
            --target-repository "$TARGET_REPOSITORY" \
            --caller-repository "$CALLER_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --release-tag "$RELEASE_TAG" \
            --target-token "$RELEASE_TARGET_TOKEN" \
            --target-token-forwarded "$RELEASE_TARGET_TOKEN_FORWARDED" \
            --github-output "$GITHUB_OUTPUT" \
            --release-metadata "$RUNNER_TEMP/release-metadata.json" \
            --provenance "$RUNNER_TEMP/resolved-agentic-provenance.json" \
            --workflow-version "$AGENTIC_WORKFLOW_VERSION"

      # Exactly one active target checkout runs, mutually exclusive on
      # `steps.release.outputs.external`, both skipped in validate_only, both
      # writing to the dedicated `release-target` path so trusted scripts in
      # $GITHUB_WORKSPACE are never overwritten.
      - name: Check out same-repository target commit (read-only)
        if: steps.resolve.outputs.validate_only != 'true' && steps.release.outputs.external == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.target_commit_sha }}
          path: release-target
          persist-credentials: false

      # External target: active only for an approved cross-repository call
      # (external == 'true') using the explicitly forwarded target-scoped
      # token. Same dedicated `release-target` path; exactly one checkout runs.
      - name: Check out external target commit (read-only)
        if: steps.resolve.outputs.validate_only != 'true' && steps.release.outputs.external == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.release.outputs.target_repository }}
          ref: ${{ steps.release.outputs.target_commit_sha }}
          token: ${{ secrets.release_target_token }}
          path: release-target
          persist-credentials: false

      - name: Review release and publish release-readiness issue
        if: steps.resolve.outputs.validate_only != 'true'
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET_TOKEN_FORWARDED: ${{ secrets.release_target_token != '' }}
          RELEASE_TARGET_TOKEN: ${{ secrets.release_target_token || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_REPOSITORY: ${{ steps.release.outputs.target_repository }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGET_COMMIT_SHA: ${{ steps.release.outputs.target_commit_sha }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          FOCUS: ${{ steps.resolve.outputs.focus }}
          CALLER_REPOSITORY: ${{ github.repository }}
          AGENTIC_WORKFLOW_VERSION: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          args=(
            review
            --resolved-config "$RUNNER_TEMP/resolved-agentic-configuration.json"
            --effective-policy "$RUNNER_TEMP/effective-policy.json"
            --release-metadata "$RUNNER_TEMP/release-metadata.json"
            --target-repository "$TARGET_REPOSITORY"
            --release-id "$RELEASE_ID"
            --release-tag "$RELEASE_TAG"
            --target-commit-sha "$TARGET_COMMIT_SHA"
            --caller-repository "$CALLER_REPOSITORY"
            --target-token "$RELEASE_TARGET_TOKEN"
            --target-token-forwarded "$RELEASE_TARGET_TOKEN_FORWARDED"
            --repo-root "$GITHUB_WORKSPACE/release-target"
            --provenance "$RUNNER_TEMP/resolved-agentic-provenance.json"
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$FOCUS" ]]; then
            args+=(--focus "$FOCUS")
          fi
          python3 "$AGENTIC_WORKFLOW_ROOT/scripts/run_agentic_release_project_review.py" "${args[@]}"

      - name: Upload resolved invocation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolved-invocation-release-project-review
          path: |
            ${{ runner.temp }}/resolved-invocation.json
            ${{ runner.temp }}/resolved-agentic-configuration.json
            ${{ runner.temp }}/effective-policy.json
            ${{ runner.temp }}/release-metadata.json
            ${{ runner.temp }}/resolved-agentic-provenance.json
          retention-days: 14
          if-no-files-found: ignore