name: OpenCode PR documentation review

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Customise these paths to select repository-specific OpenCode guidance.
      CUSTOM_AGENT_FILE: .opencode/agents/docs-impact-eval.md
      CUSTOM_SKILL_FILE: .opencode/skills/example-skill/SKILL.md
      FEEDBACK_KIND: pr-documentation-review
    steps:
      - uses: actions/checkout@v6
        with:
          # Never execute PR code in this pull_request_target workflow.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "pull/$PR_NUMBER/head:pr-head"
          git diff "$BASE_SHA" pr-head -- > pr.diff

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Review documentation impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/run_agentic_feedback.py \
            --input pr.diff \
            --prompt 'Evaluate this pull request diff.' \
            --agent-file "$CUSTOM_AGENT_FILE" \
            --skill-file "$CUSTOM_SKILL_FILE" \
            --comments-url "${{ github.event.pull_request.comments_url }}" \
            --feedback-kind "$FEEDBACK_KIND" \
            --author "${{ github.event.pull_request.user.login }}"