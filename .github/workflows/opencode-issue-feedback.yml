name: OpenCode feedback for open issues

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      configuration_source:
        description: local or an approved remote source alias
        type: string
        required: false
        default: local
      configuration_ref:
        description: Full 40-character commit SHA for a remote bundle
        type: string
        required: false
        default: ''
      configuration_profile:
        description: Bundle profile name
        type: string
        required: true
      focus:
        description: Allowlisted review focus
        type: string
        required: false
        default: ''
      max_issues:
        description: Upper bound on issues reviewed in one run (1-100)
        type: number
        required: false
        default: 100
      dry_run:
        description: Resolve, validate, and generate output without publishing
        type: boolean
        required: false
        default: false
      validate_only:
        description: Resolve and validate configuration only
        type: boolean
        required: false
        default: false
      issue_number:
        description: Open issue number to review when event context is unavailable
        type: number
        required: false
        default: 0
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  feedback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # Customise these paths to use repository-specific OpenCode guidance.
      # These remain supported during the migration period; reusable callers
      # should use configuration_profile instead (see Plan 2).
      CUSTOM_AGENT_FILE: .opencode/agents/example-agent.md
      CUSTOM_SKILL_FILE: .opencode/skills/example-skill/SKILL.md
      FEEDBACK_KIND: issue-feedback
    steps:
      - name: Resolve invocation
        id: resolve
        env:
          AGENTIC_WORKFLOW: issue-feedback
          AGENTIC_CONFIGURATION_SOURCE: ${{ github.event_name == 'workflow_call' && inputs.configuration_source || 'local' }}
          AGENTIC_CONFIGURATION_REF: ${{ github.event_name == 'workflow_call' && inputs.configuration_ref || '' }}
          AGENTIC_CONFIGURATION_PROFILE: ${{ github.event_name == 'workflow_call' && inputs.configuration_profile || 'issue-feedback' }}
          AGENTIC_FOCUS: ${{ github.event_name == 'workflow_call' && inputs.focus || '' }}
          AGENTIC_MAX_ISSUES: ${{ github.event_name == 'workflow_call' && inputs.max_issues || '' }}
          AGENTIC_DRY_RUN: ${{ github.event_name == 'workflow_call' && inputs.dry_run || false }}
          AGENTIC_VALIDATE_ONLY: ${{ github.event_name == 'workflow_call' && inputs.validate_only || false }}
          AGENTIC_TARGET_NUMBER: ${{ github.event_name == 'workflow_call' && inputs.issue_number || github.event.issue.number || '' }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_invocation.py \
            --workflow issue-feedback \
            --configuration-source "$AGENTIC_CONFIGURATION_SOURCE" \
            --configuration-ref "$AGENTIC_CONFIGURATION_REF" \
            --configuration-profile "$AGENTIC_CONFIGURATION_PROFILE" \
            --focus "$AGENTIC_FOCUS" \
            --max-issues "$AGENTIC_MAX_ISSUES" \
            --dry-run "$AGENTIC_DRY_RUN" \
            --validate-only "$AGENTIC_VALIDATE_ONLY" \
            --target-number "$AGENTIC_TARGET_NUMBER" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --result "$RUNNER_TEMP/resolved-invocation.json"

      - name: Stop after validation-only
        if: steps.resolve.outputs.validate_only == 'true'
        run: |
          echo "validate_only selected; no checkout, model invocation, or publication performed."
          echo "::notice::Resolved configuration written to job summary and artifact."

      - uses: actions/checkout@v6
        if: steps.resolve.outputs.validate_only != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        if: steps.resolve.outputs.validate_only != 'true'
        with:
          python-version: '3.12'

      - name: Install OpenCode
        if: steps.resolve.outputs.validate_only != 'true'
        run: npm install -g opencode-ai

      - name: Collect open issues
        if: steps.resolve.outputs.validate_only != 'true'
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ steps.resolve.outputs.target_number }}
          MAX_ISSUES: ${{ steps.resolve.outputs.max_issues }}
        run: |
          set -euo pipefail
          if [[ -n "$TARGET_NUMBER" ]]; then
            gh api "/repos/${{ github.repository }}/issues/$TARGET_NUMBER" > selected-issue.json
            jq -cn '[input]' selected-issue.json > open-issues.json
            echo "mode=single"
          else
            gh api --paginate "/repos/${{ github.repository }}/issues?state=open&per_page=100" > open-issues.json
            echo "mode=all"
          fi >> "$GITHUB_OUTPUT"
          if [[ -n "$MAX_ISSUES" ]]; then
            jq -c --argjson max "$MAX_ISSUES" '.[0:$max]' open-issues.json > open-issues.bounded.json
            mv open-issues.bounded.json open-issues.json
          fi

      - name: Provide feedback for open issues
        if: steps.resolve.outputs.validate_only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          FOCUS: ${{ steps.resolve.outputs.focus }}
        run: |
          jq -c '.[] | select(has("pull_request") | not)' open-issues.json | while read -r issue; do
            issue_number=$(jq -r '.number' <<< "$issue")
            issue_author=$(jq -r '.user.login // empty' <<< "$issue")
            if [[ -z "$issue_author" ]]; then
              echo "Issue #$issue_number has no GitHub author login; skipping." >&2
              continue
            fi
            jq -r '"# Issue #\(.number): \(.title)\n\n\(.body // "")"' <<< "$issue" > issue.txt
            feedback_args=(
              --input issue.txt \
              --prompt 'Review this open issue and identify missing information, risks, or useful next steps. Be concise and only offer constructive feedback.' \
              --agent-file "$CUSTOM_AGENT_FILE" \
              --skill-file "$CUSTOM_SKILL_FILE" \
              --comments-url "https://api.github.com/repos/${{ github.repository }}/issues/$issue_number/comments" \
              --feedback-kind "$FEEDBACK_KIND" \
              --author "$issue_author"
            )
            if [[ "$DRY_RUN" == "true" ]]; then
              feedback_args+=(--dry-run)
            fi
            if [[ -n "$FOCUS" ]]; then
              feedback_args+=(--focus "$FOCUS")
            fi
            python scripts/run_agentic_feedback.py "${feedback_args[@]}"
          done

      - name: Upload resolved invocation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-invocation-issue-feedback
          path: ${{ runner.temp }}/resolved-invocation.json
          retention-days: 14