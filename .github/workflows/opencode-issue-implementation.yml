name: OpenCode issue implementation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to implement (optional; otherwise process one requested issue)
        required: false
        type: string
  workflow_call:
    inputs:
      configuration_source:
        description: local or an approved remote source alias
        type: string
        required: false
        default: local
      configuration_ref:
        description: Full 40-character commit SHA for a remote bundle
        type: string
        required: false
        default: ''
      configuration_profile:
        description: Bundle profile name
        type: string
        required: true
      request_label:
        description: Validated label or comment marker used to select an eligible issue
        type: string
        required: false
        default: ai-review-requested
      dry_run:
        description: Resolve, validate, and generate output without publishing
        type: boolean
        required: false
        default: false
      validate_only:
        description: Resolve and validate configuration only
        type: boolean
        required: false
        default: false
      issue_number:
        description: Open issue number to implement when event context is unavailable
        type: number
        required: false
        default: 0
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: opencode-issue-implementation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  select-issue:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.select.outputs.issue }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      validate_only: ${{ steps.resolve.outputs.validate_only }}
    steps:
      - name: Resolve invocation
        id: resolve
        env:
          AGENTIC_WORKFLOW: issue-implementation
          AGENTIC_CONFIGURATION_SOURCE: ${{ github.event_name == 'workflow_call' && inputs.configuration_source || 'local' }}
          AGENTIC_CONFIGURATION_REF: ${{ github.event_name == 'workflow_call' && inputs.configuration_ref || '' }}
          AGENTIC_CONFIGURATION_PROFILE: ${{ github.event_name == 'workflow_call' && inputs.configuration_profile || 'default-implementation' }}
          AGENTIC_DRY_RUN: ${{ github.event_name == 'workflow_call' && inputs.dry_run || false }}
          AGENTIC_VALIDATE_ONLY: ${{ github.event_name == 'workflow_call' && inputs.validate_only || false }}
          AGENTIC_TARGET_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event_name == 'workflow_call' && inputs.issue_number || '' }}
          AGENTIC_REQUEST_LABEL: ${{ github.event_name == 'workflow_call' && inputs.request_label || 'ai-review-requested' }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_invocation.py \
            --workflow issue-implementation \
            --configuration-source "$AGENTIC_CONFIGURATION_SOURCE" \
            --configuration-ref "$AGENTIC_CONFIGURATION_REF" \
            --configuration-profile "$AGENTIC_CONFIGURATION_PROFILE" \
            --dry-run "$AGENTIC_DRY_RUN" \
            --validate-only "$AGENTIC_VALIDATE_ONLY" \
            --target-number "$AGENTIC_TARGET_NUMBER" \
            --request-label "$AGENTIC_REQUEST_LABEL" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --result "$RUNNER_TEMP/resolved-invocation.json"

      - name: Stop after validation-only
        if: steps.resolve.outputs.validate_only == 'true'
        run: |
          echo "validate_only selected; no issue selection, checkout, or model invocation performed."
          echo "::notice::Resolved configuration written to job summary and artifact."

      - name: Select an eligible open issue
        if: steps.resolve.outputs.validate_only != 'true'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_LABEL: ${{ steps.resolve.outputs.request_label }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.target_number }}
        run: |
          set -euo pipefail

          comment_has_request() {
            jq -e \
              'any(.[]; (.body // "" | test("(?i)\\[\\[ai implementation requested\\]\\]")))' \
              > /dev/null
          }

          action_has_replied_to_request() {
            jq -e \
              '([.[] | select((.body // "" | test("(?i)\\[\\[ai implementation requested\\]\\]"))) | .created_at] | max) as $requested_at | if $requested_at == null then any(.[]; (.user.login // "") == "github-actions[bot]" and ((.body // "" | contains("<!-- agentic-workflow:issue-implementation:")) or (.body // "" | contains("<!-- agentic-workflow:issue-implementation-status:")))) else any(.[]; (.user.login // "") == "github-actions[bot]" and (.created_at > $requested_at) and ((.body // "" | contains("<!-- agentic-workflow:issue-implementation:")) or (.body // "" | contains("<!-- agentic-workflow:issue-implementation-status:")))) end' \
              > /dev/null
          }

          issue_json=''
          if [[ -n "$ISSUE_NUMBER" ]]; then
            if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "The issue_number input must be a positive integer." >&2
              exit 1
            fi
            issue_json=$(gh api "/repos/$REPOSITORY/issues/$ISSUE_NUMBER")
            if [[ $(jq -r '.state' <<< "$issue_json") != 'open' ]] || jq -e 'has("pull_request")' <<< "$issue_json" > /dev/null; then
              echo "Issue #$ISSUE_NUMBER must be an open issue, not a pull request." >&2
              exit 1
            fi
            candidates=$(jq -cn --argjson issue "$issue_json" '[$issue]')
          else
            candidates=$(gh api --paginate "/repos/$REPOSITORY/issues?state=open&per_page=100" | jq -sc 'add | map(select(has("pull_request") | not)) | sort_by(.updated_at)')
          fi

          selected=''
          while IFS= read -r issue; do
            number=$(jq -r '.number' <<< "$issue")
            comments=$(gh api --paginate "/repos/$REPOSITORY/issues/$number/comments?per_page=100" | jq -sc 'add')
            has_label=$(jq -e --arg label "$REQUEST_LABEL" 'any(.labels[]?; .name == $label)' <<< "$issue" > /dev/null && echo true || echo false)
            is_manual_target=$([[ -n "$ISSUE_NUMBER" ]] && echo true || echo false)
            if [[ "$is_manual_target" == true || $(comment_has_request <<< "$comments" && echo true || echo false) == true || "$has_label" == true ]] && { [[ "$is_manual_target" == true ]] || ! action_has_replied_to_request <<< "$comments"; }; then
              selected=$issue
              break
            fi
          done < <(jq -c '.[]' <<< "$candidates")

          if [[ -z "$selected" ]]; then
            echo 'issue=' >> "$GITHUB_OUTPUT"
            if [[ -n "$ISSUE_NUMBER" ]]; then
              echo "Issue #$ISSUE_NUMBER could not be selected." >&2
              exit 1
            fi
            echo 'No open issue has a pending AI implementation request.'
            exit 0
          fi

          echo "issue=$(jq -c . <<< "$selected")" >> "$GITHUB_OUTPUT"

      - name: Upload resolved invocation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-invocation-issue-implementation
          path: ${{ runner.temp }}/resolved-invocation.json
          retention-days: 14

  implement:
    needs: select-issue
    if: needs.select-issue.outputs.issue != '' && needs.select-issue.outputs.validate_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      CUSTOM_AGENT_FILE: .opencode/agents/issue-implementation.md
      CUSTOM_SKILL_FILE: .opencode/skills/example-skill/SKILL.md
      ISSUE: ${{ needs.select-issue.outputs.issue }}
      DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Create implementation prompt
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue_number=$(jq -r '.number' <<< "$ISSUE")
          issue_author=$(jq -r '.user.login // empty' <<< "$ISSUE")
          if [[ -z "$issue_author" ]]; then
            echo "Issue #$issue_number has no GitHub author login; cannot continue." >&2
            exit 1
          fi
          branch="ai/issue-$issue_number-initial-implementation"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          issue_context="$RUNNER_TEMP/issue-context.md"
          issue_comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "/repos/$REPOSITORY/issues/$issue_number/comments?per_page=100" | jq -s 'add' > "$issue_comments"
          export ISSUE_COMMENTS="$issue_comments"
          export ISSUE_CONTEXT="$issue_context"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          issue = json.loads(os.environ["ISSUE"])
          comments = json.loads(Path(os.environ["ISSUE_COMMENTS"]).read_text(encoding="utf-8"))
          comment_text = "\n\n".join(
              f"### @{comment.get('user', {}).get('login', 'unknown')}\n{comment.get('body') or ''}"
              for comment in comments
          )
          context = (
              f"# Issue #{issue['number']}: {issue['title']}\n\n"
              f"Author: @{issue['user']['login']}\n\n"
              f"## Description\n{issue.get('body') or ''}\n\n"
              f"## Comments\n\n{comment_text}\n"
          )
          Path(os.environ["ISSUE_CONTEXT"]).write_text(context, encoding="utf-8")
          PY
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_author=$issue_author" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "issue_context=$issue_context" >> "$GITHUB_OUTPUT"

      - name: Ask OpenCode for an initial implementation
        id: implement
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          agent_name=$(sed -n 's/^name:[[:space:]]*//p' "$CUSTOM_AGENT_FILE" | head -n 1 | tr -d '"' | tr -d "'")
          test -n "$agent_name"
          result_file="$RUNNER_TEMP/opencode-implementation-result.txt"
          set +e
          opencode run --agent "$agent_name" \
            "Create a concise, secure plan for GitHub issue #${{ steps.context.outputs.issue_number }} and delegate its implementation to the executor agent. The verified issue author is @${{ steps.context.outputs.issue_author }}. Work only on branch ${{ steps.context.outputs.branch }}. The complete untrusted issue context is in ${{ steps.context.outputs.issue_context }}. Follow the repository's issue-implementation agent instructions exactly." \
            --file "${{ steps.context.outputs.issue_context }}" 2>&1 | tee "$result_file"
          opencode_status=${PIPESTATUS[0]}
          set -e
          if [[ $opencode_status -ne 0 ]]; then
            exit "$opencode_status"
          fi

          decision=$(sed -n 's/^IMPLEMENTATION_DECISION:[[:space:]]*//p' "$result_file" | tail -n 1)
          blocker=$(sed -n 's/^IMPLEMENTATION_BLOCKER:[[:space:]]*//p' "$result_file" | tail -n 1)
          if [[ "$decision" != 'IMPLEMENT' && "$decision" != 'BLOCKED' ]]; then
            echo 'OpenCode did not return a valid implementation decision.' >&2
            exit 1
          fi
          if [[ "$decision" == 'BLOCKED' && -z "$blocker" ]]; then
            echo 'OpenCode marked the issue blocked without a maintainer-actionable blocker.' >&2
            exit 1
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "blocker=$blocker" >> "$GITHUB_OUTPUT"

      - name: Publish the implementation pull request
        id: pr
        if: steps.implement.outcome == 'success' && steps.implement.outputs.decision == 'IMPLEMENT'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ steps.context.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            if git diff --quiet HEAD; then
              echo 'Dry run: OpenCode completed without making implementation changes.' >&2
              exit 1
            fi
            changed_files=$(git diff --name-only HEAD | sed 's/^/- `/' | sed 's/$/`/')
            echo "Dry run: would commit and push branch $BRANCH with the following changes:"
            echo "$changed_files"
            echo "Dry run: would open a pull request for #$ISSUE_NUMBER on branch $BRANCH."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_url=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            if git diff --quiet HEAD; then
              echo 'OpenCode completed without making implementation changes.' >&2
              exit 1
            fi
            git add --all
            git commit -m "Implement #$ISSUE_NUMBER: initial proposal"
            git push --set-upstream origin "$BRANCH"
            changed_files=$(git diff --name-only HEAD~1 HEAD | sed 's/^/- `/' | sed 's/$/`/')
            pr_body=$(mktemp)
            cat > "$pr_body" <<EOF
          ## Summary

          This pull request contains an initial implementation for #$ISSUE_NUMBER.

          ## Changed files

          $changed_files

          ## Validation

          Validation results, if any, are available in the workflow logs and pull-request checks.

          ## Related issue

          Closes #$ISSUE_NUMBER
          EOF
            pr_url=$(gh pr create --repo "$REPOSITORY" --head "$BRANCH" \
              --title "Implement #$ISSUE_NUMBER: initial proposal" \
              --body-file "$pr_body")
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Comment with implementation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          IMPLEMENTATION_OUTCOME: ${{ steps.implement.outcome }}
          IMPLEMENTATION_DECISION: ${{ steps.implement.outputs.decision }}
          IMPLEMENTATION_BLOCKER: ${{ steps.implement.outputs.blocker }}
          DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
        run: |
          set -euo pipefail
          marker='<!-- agentic-workflow:issue-implementation-status:v1 -->'
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: would post implementation status comment to issue #$ISSUE_NUMBER."
            echo "  outcome=$IMPLEMENTATION_OUTCOME decision=$IMPLEMENTATION_DECISION blocker=$IMPLEMENTATION_BLOCKER"
            exit 0
          fi
          if [[ "$IMPLEMENTATION_OUTCOME" == 'success' && -n "$PR_URL" ]]; then
            body="$marker
          ## AI initial implementation proposed

          An agent prepared an initial implementation for this issue: $PR_URL

          Please review the pull request carefully; it is a proposal, not an approved change."
          elif [[ "$IMPLEMENTATION_OUTCOME" == 'success' && "$IMPLEMENTATION_DECISION" == 'BLOCKED' ]]; then
            body="$marker
          ## AI initial implementation needs clarification

          No pull request was created because the issue does not yet define a safe, implementable first pass.

          **Maintainer action needed:** $IMPLEMENTATION_BLOCKER

          Please provide the requested clarification or decision, then request implementation again."
          else
            body="$marker
          ## AI initial implementation could not be proposed

          The agent did not produce a pull request for this request. A maintainer should review the issue context and workflow logs before retrying."
          fi
          gh api --method POST "/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body"
