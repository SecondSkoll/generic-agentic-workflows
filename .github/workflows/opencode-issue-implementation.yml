name: OpenCode issue implementation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to implement (optional; otherwise process one requested issue)
        required: false
        type: string
  workflow_call:
    inputs:
      configuration_source:
        description: default (supplied profile), local (caller repository), or an approved central alias
        type: string
        required: false
        default: default
      configuration_ref:
        description: Full 40-character commit SHA for a remote bundle
        type: string
        required: false
        default: ''
      configuration_profile:
        description: Bundle profile name
        type: string
        required: true
      request_label:
        description: Validated label or comment marker used to select an eligible issue
        type: string
        required: false
        default: ai-implementation-requested
      dry_run:
        description: Resolve, validate, and generate output without publishing
        type: boolean
        required: false
        default: false
      validate_only:
        description: Resolve and validate configuration only
        type: boolean
        required: false
        default: false
      issue_number:
        description: Open issue number to implement when event context is unavailable
        type: number
        required: false
        default: 0
    secrets:
      OPENROUTER_API_KEY:
        required: true
      central_config_token:
        description: Optional read token for a private central configuration repository; falls back to github.token.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: opencode-issue-implementation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  select-issue:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.select.outputs.issue }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      validate_only: ${{ steps.resolve.outputs.validate_only }}
    steps:
      # The resolver is stored in the caller repository checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve invocation
        id: resolve
        env:
          AGENTIC_WORKFLOW: issue-implementation
          AGENTIC_CONFIGURATION_SOURCE: ${{ github.event_name == 'workflow_call' && inputs.configuration_source || 'local' }}
          AGENTIC_CONFIGURATION_REF: ${{ github.event_name == 'workflow_call' && inputs.configuration_ref || '' }}
          AGENTIC_CONFIGURATION_PROFILE: ${{ github.event_name == 'workflow_call' && inputs.configuration_profile || 'default-implementation' }}
          AGENTIC_DRY_RUN: ${{ github.event_name == 'workflow_call' && inputs.dry_run || false }}
          AGENTIC_VALIDATE_ONLY: ${{ github.event_name == 'workflow_call' && inputs.validate_only || false }}
          AGENTIC_TARGET_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event_name == 'workflow_call' && inputs.issue_number || '' }}
          AGENTIC_REQUEST_LABEL: ${{ github.event_name == 'workflow_call' && inputs.request_label || 'ai-implementation-requested' }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_invocation.py \
            --workflow issue-implementation \
            --configuration-source "$AGENTIC_CONFIGURATION_SOURCE" \
            --configuration-ref "$AGENTIC_CONFIGURATION_REF" \
            --configuration-profile "$AGENTIC_CONFIGURATION_PROFILE" \
            --dry-run "$AGENTIC_DRY_RUN" \
            --validate-only "$AGENTIC_VALIDATE_ONLY" \
            --target-number "$AGENTIC_TARGET_NUMBER" \
            --request-label "$AGENTIC_REQUEST_LABEL" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --result "$RUNNER_TEMP/resolved-invocation.json"

      - name: Stop after validation-only
        if: steps.resolve.outputs.validate_only == 'true'
        run: |
          echo "validate_only selected; no issue selection, checkout, or model invocation performed."
          echo "::notice::Resolved configuration written to job summary and artifact."

      - name: Select an eligible open issue
        if: steps.resolve.outputs.validate_only != 'true'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_LABEL: ${{ steps.resolve.outputs.request_label }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.target_number }}
        run: |
          set -euo pipefail

          comment_has_request() {
            jq -e \
              'any(.[]; (.body // "" | test("(?i)\\[\\[ai implementation requested\\]\\]")))' \
              > /dev/null
          }

          action_has_replied_to_request() {
            jq -e \
              '([.[] | select((.body // "" | test("(?i)\\[\\[ai implementation requested\\]\\]"))) | .created_at] | max) as $requested_at | if $requested_at == null then any(.[]; (.user.login // "") == "github-actions[bot]" and ((.body // "" | contains("<!-- agentic-workflow:issue-implementation:")) or (.body // "" | contains("<!-- agentic-workflow:issue-implementation-status:")))) else any(.[]; (.user.login // "") == "github-actions[bot]" and (.created_at > $requested_at) and ((.body // "" | contains("<!-- agentic-workflow:issue-implementation:")) or (.body // "" | contains("<!-- agentic-workflow:issue-implementation-status:")))) end' \
              > /dev/null
          }

          issue_json=''
          if [[ -n "$ISSUE_NUMBER" ]]; then
            if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "The issue_number input must be a positive integer." >&2
              exit 1
            fi
            issue_json=$(gh api "/repos/$REPOSITORY/issues/$ISSUE_NUMBER")
            if [[ $(jq -r '.state' <<< "$issue_json") != 'open' ]] || jq -e 'has("pull_request")' <<< "$issue_json" > /dev/null; then
              echo "Issue #$ISSUE_NUMBER must be an open issue, not a pull request." >&2
              exit 1
            fi
            candidates=$(jq -cn --argjson issue "$issue_json" '[$issue]')
          else
            candidates=$(gh api --paginate "/repos/$REPOSITORY/issues?state=open&per_page=100" | jq -sc 'add | map(select(has("pull_request") | not)) | sort_by(.updated_at)')
          fi

          selected=''
          while IFS= read -r issue; do
            number=$(jq -r '.number' <<< "$issue")
            comments=$(gh api --paginate "/repos/$REPOSITORY/issues/$number/comments?per_page=100" | jq -sc 'add')
            has_label=$(jq -e --arg label "$REQUEST_LABEL" 'any(.labels[]?; .name == $label)' <<< "$issue" > /dev/null && echo true || echo false)
            is_manual_target=$([[ -n "$ISSUE_NUMBER" ]] && echo true || echo false)
            if [[ "$is_manual_target" == true || $(comment_has_request <<< "$comments" && echo true || echo false) == true || "$has_label" == true ]] && { [[ "$is_manual_target" == true ]] || ! action_has_replied_to_request <<< "$comments"; }; then
              selected=$issue
              break
            fi
          done < <(jq -c '.[]' <<< "$candidates")

          if [[ -z "$selected" ]]; then
            echo 'issue=' >> "$GITHUB_OUTPUT"
            if [[ -n "$ISSUE_NUMBER" ]]; then
              echo "Issue #$ISSUE_NUMBER could not be selected." >&2
              exit 1
            fi
            echo 'No open issue has a pending AI implementation request.'
            exit 0
          fi

          echo "issue=$(jq -c . <<< "$selected")" >> "$GITHUB_OUTPUT"

      - name: Upload resolved invocation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolved-invocation-issue-implementation
          path: ${{ runner.temp }}/resolved-invocation.json
          retention-days: 14
          if-no-files-found: ignore

  implement:
    needs: select-issue
    if: needs.select-issue.outputs.issue != '' && needs.select-issue.outputs.validate_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ needs.select-issue.outputs.issue }}
      DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Resolve agentic configuration
        id: config
        env:
          AGENTIC_WORKFLOW: issue-implementation
          AGENTIC_CONFIGURATION_SOURCE: ${{ github.event_name == 'workflow_call' && inputs.configuration_source || 'local' }}
          AGENTIC_CONFIGURATION_REF: ${{ github.event_name == 'workflow_call' && inputs.configuration_ref || '' }}
          AGENTIC_CONFIGURATION_PROFILE: ${{ github.event_name == 'workflow_call' && inputs.configuration_profile || 'default-implementation' }}
          GITHUB_TOKEN: ${{ secrets.central_config_token || github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agentic_configuration.py \
            --workflow issue-implementation \
            --configuration-source "$AGENTIC_CONFIGURATION_SOURCE" \
            --configuration-ref "$AGENTIC_CONFIGURATION_REF" \
            --configuration-profile "$AGENTIC_CONFIGURATION_PROFILE" \
            --result "$RUNNER_TEMP/resolved-agentic-configuration.json"

      - name: Resolve effective policy
        id: policy
        env:
          DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
        run: |
          set -euo pipefail
          model_profile=$(jq -r '.model_profile' "$RUNNER_TEMP/resolved-agentic-configuration.json")
          mode="publish"
          if [[ "$DRY_RUN" == "true" ]]; then mode="dry-run"; fi
          # Derive actual agent capabilities from the verified resolved agent
          # front matter (required change #3), not a hardcoded empty object.
          agent_caps=$(python3 - <<'PY'
          import json, sys, importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("agentic_policy", "scripts/agentic_policy.py")
          pol = importlib.util.module_from_spec(spec); sys.modules[spec.name] = pol; spec.loader.exec_module(pol)
          data = json.loads(Path(__import__("os").environ["RUNNER_TEMP"] + "/resolved-agentic-configuration.json").read_text())
          caps = {}
          bundle_root = Path(data["bundle_root"])
          # Primary planner agent capabilities.
          agent_text = (bundle_root / data["agent_file"]).read_text(encoding="utf-8")
          caps = pol.parse_agent_capabilities(agent_text)
          # Intersect with additional (executor) agent capabilities.
          for rel in data.get("additional_agent_files", []):
              extra = pol.parse_agent_capabilities((bundle_root / rel).read_text(encoding="utf-8"))
              for axis, val in extra.items():
                  if axis in caps:
                      caps[axis] = pol.intersect_capability(caps[axis], val)
                  else:
                      caps[axis] = val
          print(json.dumps(caps))
          PY
          )
          overlay_arg=""
          if [[ -f .github/agentic-policy-overlay.json ]]; then
            overlay_arg="--overlay .github/agentic-policy-overlay.json"
          fi
          python3 scripts/agentic_policy.py \
            --workflow issue-implementation \
            --model-profile "$model_profile" \
            --resolved-config "$RUNNER_TEMP/resolved-agentic-configuration.json" \
            --agent-capabilities-json "$agent_caps" \
            --mode "$mode" \
            $overlay_arg \
            --result "$RUNNER_TEMP/effective-policy.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
          || {
            python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location("agentic_provenance", "scripts/agentic_provenance.py")
          prov = importlib.util.module_from_spec(spec); sys.modules[spec.name] = prov; spec.loader.exec_module(prov)
          bundle = json.loads(Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-configuration.json").read_text())
          record = prov.failure_record(
              workflow_version=os.environ.get("AGENTIC_WORKFLOW_VERSION", "dev"),
              workflow_name="issue-implementation",
              caller_repository=os.environ.get("GITHUB_REPOSITORY", ""),
              mode="publish",
              error=RuntimeError("policy resolution failed"),
              bundle=bundle,
          )
          Path(os.environ["RUNNER_TEMP"] + "/resolved-agentic-provenance.json").write_text(record.to_json() + "\n")
          PY
            exit 1
          }
          echo "sha256=$(jq -r '.sha256' "$RUNNER_TEMP/effective-policy.json")" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted base ref for changed-path enforcement
        id: base_ref
        run: |
          set -euo pipefail
          # Resolve the default branch remote ref and export it via GITHUB_ENV
          # so changed-path enforcement uses a trusted, fetched base. Hard-fail
          # if unresolvable (required change #4); never silently omit the
          # committed range. Pass via env, not Python source interpolation.
          python3 - <<'PY'
          import importlib.util, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("agentic_policy", "scripts/agentic_policy.py")
          mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)
          ref = mod.resolve_default_branch_ref(Path.cwd(), remote="origin")
          gh_env = Path(os.environ["GITHUB_ENV"])
          with gh_env.open("a") as f:
              f.write(f"AGENTIC_BASE_REF={ref}\n")
          print(f"OK base ref: {ref}")
          PY

      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.16

      - name: Create implementation prompt
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue_number=$(jq -r '.number' <<< "$ISSUE")
          issue_author=$(jq -r '.user.login // empty' <<< "$ISSUE")
          if [[ -z "$issue_author" ]]; then
            echo "Issue #$issue_number has no GitHub author login; cannot continue." >&2
            exit 1
          fi
          branch="ai/issue-$issue_number-initial-implementation"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          issue_context="$RUNNER_TEMP/issue-context.md"
          issue_comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "/repos/$REPOSITORY/issues/$issue_number/comments?per_page=100" | jq -s 'add' > "$issue_comments"
          export ISSUE_COMMENTS="$issue_comments"
          export ISSUE_CONTEXT="$issue_context"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          issue = json.loads(os.environ["ISSUE"])
          comments = json.loads(Path(os.environ["ISSUE_COMMENTS"]).read_text(encoding="utf-8"))
          comment_text = "\n\n".join(
              f"### @{comment.get('user', {}).get('login', 'unknown')}\n{comment.get('body') or ''}"
              for comment in comments
          )
          context = (
              f"# Issue #{issue['number']}: {issue['title']}\n\n"
              f"Author: @{issue['user']['login']}\n\n"
              f"## Description\n{issue.get('body') or ''}\n\n"
              f"## Comments\n\n{comment_text}\n"
          )
          Path(os.environ["ISSUE_CONTEXT"]).write_text(context, encoding="utf-8")
          PY
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_author=$issue_author" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "issue_context=$issue_context" >> "$GITHUB_OUTPUT"

      - name: Ask OpenCode for an initial implementation
        id: implement
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENTIC_WORKFLOW_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/run_agentic_implementation.py \
            --resolved-config "$RUNNER_TEMP/resolved-agentic-configuration.json" \
            --effective-policy "$RUNNER_TEMP/effective-policy.json" \
            --issue-context "${{ steps.context.outputs.issue_context }}" \
            --issue-number "${{ steps.context.outputs.issue_number }}" \
            --issue-author "${{ steps.context.outputs.issue_author }}" \
            --repository "${{ github.repository }}" \
            --branch "${{ steps.context.outputs.branch }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT" \
            --result "$RUNNER_TEMP/opencode-implementation-result.txt" \
            --provenance "$RUNNER_TEMP/resolved-agentic-provenance.json"

      - name: Enforce changed paths before publication
        id: changed_paths
        if: steps.implement.outcome == 'success' && steps.implement.outputs.decision == 'IMPLEMENT'
        run: |
          set -euo pipefail
          offenders=$(python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "agentic_policy", "scripts/agentic_policy.py"
          )
          mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)
          # Capture tracked + untracked + committed changes so agent-created
          # files and commits cannot bypass enforcement.
          changed = mod.collect_implementation_changed_paths(
              Path.cwd(), base_ref=__import__("os").environ.get("AGENTIC_BASE_REF")
          )
          if not changed:
              print("__NO_CHANGES__")
          else:
              offenders = mod.enforce_changed_paths(changed, workflow="issue-implementation")
              for o in offenders:
                  print(o)
          PY
          )
          if [[ "$offenders" == "__NO_CHANGES__" ]]; then
            echo "OpenCode completed without making implementation changes." >&2
            exit 1
          fi
          if [[ -n "$offenders" ]]; then
            echo "::error::Implementation modified denied paths:" >&2
            echo "$offenders" >&2
            echo "Deny categories: workflows, automation, dependencies, agent/skill/configuration instructions." >&2
            exit 1
          fi
          changed=$(python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "agentic_policy", "scripts/agentic_policy.py"
          )
          mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)
          for p in mod.collect_implementation_changed_paths(Path.cwd(), base_ref=__import__("os").environ.get("AGENTIC_BASE_REF")):
              print(p)
          PY
          )
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish the implementation pull request
        id: pr
        if: steps.implement.outcome == 'success' && steps.implement.outputs.decision == 'IMPLEMENT' && steps.changed_paths.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ steps.context.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
        run: |
          set -euo pipefail
          # Recheck changed paths immediately before push, using the same
          # collector + enforcer. A denial here must prevent push/PR creation.
          python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "agentic_policy", "scripts/agentic_policy.py"
          )
          mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)
          changed = mod.collect_implementation_changed_paths(
              Path.cwd(), base_ref=__import__("os").environ.get("AGENTIC_BASE_REF")
          )
          offenders = mod.enforce_changed_paths(changed, workflow="issue-implementation")
          if offenders:
              print("::error::Pre-push changed-path recheck denied: " + ", ".join(offenders))
              sys.exit(1)
          PY
          if [[ "$DRY_RUN" == "true" ]]; then
            changed_files=$(python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "agentic_policy", "scripts/agentic_policy.py"
          )
          mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)
          for p in mod.collect_implementation_changed_paths(Path.cwd(), base_ref=__import__("os").environ.get("AGENTIC_BASE_REF")):
              print(f"- `{p}`")
          PY
          )
            if [[ -z "$changed_files" ]]; then
              echo 'Dry run: OpenCode completed without making implementation changes.' >&2
              exit 1
            fi
            echo "Dry run: would commit and push branch $BRANCH with the following changes:"
            echo "$changed_files"
            echo "Dry run: would open a pull request for #$ISSUE_NUMBER on branch $BRANCH."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_url=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            changed=$(python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "agentic_policy", "scripts/agentic_policy.py"
          )
          mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)
          for p in mod.collect_implementation_changed_paths(Path.cwd(), base_ref=__import__("os").environ.get("AGENTIC_BASE_REF")):
              print(p)
          PY
          )
            if [[ -z "$changed" ]]; then
              echo 'OpenCode completed without making implementation changes.' >&2
              exit 1
            fi
            git add --all
            git commit -m "Implement #$ISSUE_NUMBER: initial proposal"
            git push --set-upstream origin "$BRANCH"
            changed_files=$(echo "$changed" | sed 's/^/- `/' | sed 's/$/`/')
            pr_body=$(mktemp)
            cat > "$pr_body" <<EOF
          ## Summary

          This pull request contains an initial implementation for #$ISSUE_NUMBER.

          ## Changed files

          $changed_files

          ## Validation

          Validation results, if any, are available in the workflow logs and pull-request checks.

          ## Related issue

          Closes #$ISSUE_NUMBER
          EOF
            pr_url=$(gh pr create --repo "$REPOSITORY" --head "$BRANCH" \
              --title "Implement #$ISSUE_NUMBER: initial proposal" \
              --body-file "$pr_body")
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Write provenance record
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          AGENTIC_WORKFLOW_VERSION: ${{ github.sha }}
          IMPLEMENTATION_OUTCOME: ${{ steps.implement.outcome }}
          IMPLEMENTATION_DECISION: ${{ steps.implement.outputs.decision }}
          DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "agentic_provenance", "scripts/agentic_provenance.py"
          )
          prov = importlib.util.module_from_spec(spec); sys.modules[spec.name] = prov; spec.loader.exec_module(prov)
          bundle = {}
          cfg_path = Path(os.environ["RUNNER_TEMP"]) / "resolved-agentic-configuration.json"
          if cfg_path.exists():
              bundle = json.loads(cfg_path.read_text())
          pol_path = Path(os.environ["RUNNER_TEMP"]) / "effective-policy.json"
          policy_sha = None
          if pol_path.exists():
              policy_sha = json.loads(pol_path.read_text()).get("sha256")
          mode = "dry-run" if os.environ.get("DRY_RUN") == "true" else "publish"
          decision = os.environ.get("IMPLEMENTATION_DECISION", "")
          outcome = os.environ.get("IMPLEMENTATION_OUTCOME", "")
          # If the implementation runner already wrote a provenance record,
          # extend/keep it; otherwise emit a minimal redacted record covering
          # failure and skipped paths.
          out = Path(os.environ["RUNNER_TEMP"]) / "resolved-agentic-provenance.json"
          if out.exists():
              record = json.loads(out.read_text())
          else:
              if outcome == "success" and decision == "IMPLEMENT":
                  result = "published" if os.environ.get("DRY_RUN") != "true" else "generated"
              elif outcome == "success" and decision == "BLOCKED":
                  result = "skipped"
              else:
                  result = "failed"
              record = prov.build_provenance(
                  workflow_version=os.environ.get("AGENTIC_WORKFLOW_VERSION", "dev"),
                  workflow_name="issue-implementation",
                  caller_repository=os.environ["REPOSITORY"],
                  target_kind="issue",
                  target_number=int(os.environ["ISSUE_NUMBER"]) if os.environ.get("ISSUE_NUMBER") else None,
                  target_head_sha=None,
                  bundle=bundle,
                  prompt_template_sha256=bundle.get("prompt_template_sha256"),
                  output_contract=bundle.get("output_contract"),
                  model_profile=bundle.get("model_profile"),
                  effective_policy_sha256=policy_sha,
                  mode=mode,
                  result=result,
              ).to_dict()
          out.write_text(json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          # Append a concise summary.
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          existing = summary.read_text() if summary.exists() else ""
          if existing and not existing.endswith("\n"):
              existing += "\n"
          rec = prov.build_provenance(
              workflow_version=record.get("workflow_version", "dev"),
              workflow_name=record.get("workflow_name", "issue-implementation"),
              caller_repository=record.get("caller_repository", os.environ["REPOSITORY"]),
              target_kind=record.get("target", {}).get("kind", "issue"),
              target_number=record.get("target", {}).get("number"),
              target_head_sha=record.get("target", {}).get("head_sha"),
              bundle=record.get("bundle", bundle),
              prompt_template_sha256=record.get("prompt_template_sha256"),
              output_contract=record.get("output_contract"),
              model_profile=record.get("model_profile"),
              effective_policy_sha256=record.get("effective_policy_sha256"),
              mode=record.get("mode", mode),
              result=record.get("result", "failed"),
          )
          summary.write_text(existing + prov.job_summary(rec), encoding="utf-8")
          PY

      - name: Comment with implementation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          IMPLEMENTATION_OUTCOME: ${{ steps.implement.outcome }}
          IMPLEMENTATION_DECISION: ${{ steps.implement.outputs.decision }}
          IMPLEMENTATION_BLOCKER: ${{ steps.implement.outputs.blocker }}
          DRY_RUN: ${{ needs.select-issue.outputs.dry_run }}
        run: |
          set -euo pipefail
          marker='<!-- agentic-workflow:issue-implementation-status:v1 -->'
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: would post implementation status comment to issue #$ISSUE_NUMBER."
            echo "  outcome=$IMPLEMENTATION_OUTCOME decision=$IMPLEMENTATION_DECISION blocker=$IMPLEMENTATION_BLOCKER"
            exit 0
          fi
          if [[ "$IMPLEMENTATION_OUTCOME" == 'success' && -n "$PR_URL" ]]; then
            body="$marker
          ## AI initial implementation proposed

          An agent prepared an initial implementation for this issue: $PR_URL

          Please review the pull request carefully; it is a proposal, not an approved change."
          elif [[ "$IMPLEMENTATION_OUTCOME" == 'success' && "$IMPLEMENTATION_DECISION" == 'BLOCKED' ]]; then
            body="$marker
          ## AI initial implementation needs clarification

          No pull request was created because the issue does not yet define a safe, implementable first pass.

          **Maintainer action needed:** $IMPLEMENTATION_BLOCKER

          Please provide the requested clarification or decision, then request implementation again."
          else
            body="$marker
          ## AI initial implementation could not be proposed

          The agent did not produce a pull request for this request. A maintainer should review the issue context and workflow logs before retrying."
          fi
          gh api --method POST "/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body"

      - name: Upload provenance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolved-configuration-issue-implementation
          path: |
            ${{ runner.temp }}/resolved-agentic-configuration.json
            ${{ runner.temp }}/effective-policy.json
            ${{ runner.temp }}/resolved-agentic-provenance.json
          retention-days: 14
          if-no-files-found: ignore
