name: Verify reusable workflows

# Runs the full test suite, including static reusable-workflow wiring,
# validate-only resolver invocations, configuration-bundle materialization,
# hash freshness, and policy/prompt/provenance validation. It also validates the
# documentation build and links. The only separate test invocation is the
# authenticated central configuration pin ancestry check.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.opencode/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.readthedocs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Sync development dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check scripts tests

      - name: Verify reusable workflow wiring
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m unittest -v
          tests.test_verify_reusable_workflows.ReusableWorkflowVerificationTests.test_central_pin_is_reachable_from_main

      - name: Compile all scripts
        run: |
          set -euo pipefail
          uv run python -m py_compile scripts/*.py

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install OpenCode for schema smoke checks
        # The postinstall script creates the real platform binary
        # (bin/opencode.exe); npm's allow-scripts gate blocks it unless the
        # exact-pinned package is allow-listed. The scoped flag permits only
        # opencode-ai, with no wildcard or persistent npm config.
        run: |
          set -euo pipefail
          npm install -g --allow-scripts=opencode-ai opencode-ai@1.18.16
          opencode --version

      - name: Run unit tests (includes real OpenCode smoke when binary present)
        run: uv run python -m unittest discover -s tests -v

# End of workflow.
