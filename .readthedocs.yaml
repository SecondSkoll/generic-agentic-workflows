# .readthedocs.yaml
# Read the Docs configuration file.
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details.

# Required
version: 2

# Set the OS and Python version.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git fetch --unshallow || true

# Build documentation in the docs/ directory with Sphinx.
sphinx:
  builder: dirhtml
  configuration: docs/conf.py
  fail_on_warning: true

# Install project dependencies (including the `docs` extra) using uv via the
# official Read the Docs uv install method.
python:
  install:
    - method: uv
      command: sync
      extras:
        - docs
